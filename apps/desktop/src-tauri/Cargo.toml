[package]
name = "academic-integrity-recorder"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "academic_integrity_recorder_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "academic-integrity-recorder"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.4", features = [] }

[dependencies]
anyhow.workspace = true
base64.workspace = true
capture-adapters = { path = "../../../crates/capture-adapters" }
chrono.workspace = true
evidence-core = { path = "../../../crates/evidence-core" }
keyring = { version = "3.6", features = ["apple-native", "windows-native", "sync-secret-service"] }
serde.workspace = true
serde_json.workspace = true
tauri = { version = "2.8", features = ["tray-icon"] }
tauri-plugin-dialog = "2.4"
uuid.workspace = true
walkdir = "2.5"
tiny_http = "0.12"
hmac = "0.12"
sha2.workspace = true
hex.workspace = true

[target.'cfg(any(target_os = "macos", target_os = "windows", target_os = "linux"))'.dependencies]
tauri-plugin-global-shortcut = "2"

[dev-dependencies]
tempfile = "3.14"
